services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Port_of_Spain
    volumes:
      - /DATA/AppData/prowlarr/config:/config
    ports:
      - 127.0.0.1:9696:9696
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
